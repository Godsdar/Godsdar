<text x="46" y="139" font-size="82" font-weight="600" letter-spacing="-2" fill="none" stroke="#7aa2f7" stroke-width=".6" opacity=".2">Godsdar</text>
<text x="44" y="137" font-size="82" font-weight="600" letter-spacing="-2" fill="#c0caf5">Godsdar<tspan fill="#7aa2f7">▍</tspan></text>
<text x="46" y="178" font-size="22" fill="#bb9af7">software engineer</text>
<text x="46" y="215" font-size="20" fill="#7aa2f7">Node.js / TypeScript / React / Next.js</text>
