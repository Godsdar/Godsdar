<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260" role="img" aria-labelledby="title desc">
<title id="title">Godsdar — software engineer</title><desc id="desc">A quiet terminal window with icy blue type and a soft spectral glow. Node.js, TypeScript, React, open source, tests and CI.</desc>
<defs>
<linearGradient id="night" x2="1" y2="0"><stop stop-color="#16161e"/><stop offset=".55" stop-color="#1a1b26"/><stop offset="1" stop-color="#16161e"/></linearGradient>
<radialGradient id="haze"><stop stop-color="#7aa2f7" stop-opacity=".11"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/></radialGradient>
<linearGradient id="edge" x2="1" y2="0"><stop stop-color="#414868" stop-opacity=".35"/><stop offset=".5" stop-color="#7aa2f7" stop-opacity=".65"/><stop offset="1" stop-color="#414868" stop-opacity=".2"/></linearGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3H4" stroke="#c0caf5" stroke-opacity=".018"/></pattern>
</defs>
<rect x="1" y="1" width="1098" height="258" rx="8" fill="url(#night)" stroke="#292e42"/>
<ellipse cx="605" cy="161" rx="528" ry="161" fill="url(#haze)"/>
<rect x="1" y="1" width="1098" height="258" rx="8" fill="url(#scan)"/>
<path d="M9 1H1091M9 259H1091" stroke="url(#edge)"/>
<path d="M1 38H1099" stroke="#292e42"/>
