<svg xmlns="http://www.w3.org/2000/svg" width="600" height="310" viewBox="0 0 600 310" role="img" aria-labelledby="title desc">
<title id="title">Godsdar — Software Engineer</title><desc id="desc">A translucent macOS-style terminal with soft blurred blue and purple light. From architecture to working software. Open source, tests and CI.</desc>
