<ellipse cx="468" cy="248" rx="198" ry="186" fill="#7aa2f7" opacity=".46"/>
<ellipse cx="582" cy="31" rx="168" ry="210" fill="#bb9af7" opacity=".42"/>
<ellipse cx="222" cy="288" rx="132" ry="130" fill="#7dcfff" opacity=".15"/>
</g>
