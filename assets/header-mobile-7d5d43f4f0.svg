<linearGradient id="edge" x2="1" y2="0"><stop stop-color="#c0caf5" stop-opacity=".3"/><stop offset=".5" stop-color="#7aa2f7" stop-opacity=".5"/><stop offset="1" stop-color="#c0caf5" stop-opacity=".18"/></linearGradient>
<clipPath id="window"><rect x="8" y="8" width="584" height="294" rx="14"/></clipPath>
</defs>
<g clip-path="url(#window)">
