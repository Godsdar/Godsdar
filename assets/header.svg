<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Godsdar — fullstack developer</title>
<desc id="desc">Tokyo Night terminal with a constellation of connected code branches. TypeScript, Node.js, React. Open source, language tools and interactive graphics.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#16161e"/><stop offset="1" stop-color="#24283b"/></linearGradient>
 <linearGradient id="light" x2="1" y2="0"><stop stop-color="#7aa2f7"/><stop offset=".55" stop-color="#bb9af7"/><stop offset="1" stop-color="#7dcfff"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#7aa2f7" stop-opacity=".16"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#565f89" stroke-opacity=".14"/></pattern>
</defs>
<rect x="1" y="1" width="1198" height="418" rx="20" fill="url(#bg)" stroke="#414868"/>
<rect x="1" y="1" width="1198" height="418" rx="20" fill="url(#grid)"/>
<circle cx="960" cy="210" r="260" fill="url(#glow)"/>
<path d="M21 1H1179" stroke="url(#light)" stroke-width="2"/>
<path d="M1 53H1199" stroke="#414868"/>
<circle cx="29" cy="28" r="5" fill="#f7768e"/><circle cx="47" cy="28" r="5" fill="#e0af68"/><circle cx="65" cy="28" r="5" fill="#9ece6a"/>
<g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace">
 <text x="91" y="33" font-size="13" fill="#a9b1d6">~/godsdar</text>
 <text x="1168" y="33" text-anchor="end" font-size="11" letter-spacing="2" fill="#a9b1d6">TOKYO NIGHT / 01</text>
 <text x="52" y="113" font-size="15"><tspan fill="#9ece6a">❯</tspan><tspan x="73" fill="#a9b1d6">whoami</tspan></text>
 <text x="48" y="185" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="68" font-weight="700" letter-spacing="-3" fill="#c0caf5">Godsdar<tspan fill="#7dcfff">_</tspan></text>
 <text x="52" y="226" font-size="18" fill="#bb9af7">fullstack developer / frontend-minded</text>
 <text x="52" y="263" font-size="15" fill="#a9b1d6">TypeScript <tspan fill="#565f89">·</tspan> Node.js <tspan fill="#565f89">·</tspan> React <tspan fill="#565f89">·</tspan> Next.js</text>
 <g transform="translate(52 293)">
  <rect width="122" height="30" rx="6" fill="#7aa2f7" fill-opacity=".09" stroke="#7aa2f7" stroke-opacity=".4"/>
  <text x="61" y="20" text-anchor="middle" font-size="12" fill="#7aa2f7">open source</text>
  <rect x="134" width="133" height="30" rx="6" fill="#bb9af7" fill-opacity=".09" stroke="#bb9af7" stroke-opacity=".4"/>
  <text x="200" y="20" text-anchor="middle" font-size="12" fill="#bb9af7">language tools</text>
  <rect x="279" width="122" height="30" rx="6" fill="#7dcfff" fill-opacity=".09" stroke="#7dcfff" stroke-opacity=".4"/>
  <text x="340" y="20" text-anchor="middle" font-size="12" fill="#7dcfff">web graphics</text>
 </g>
 <text x="52" y="383" font-size="12" fill="#a9b1d6">ALMATY / UTC+5</text>
 <text x="1160" y="383" text-anchor="end" font-size="12" fill="#9ece6a">remote full-time + contracts</text>
</g>
<!-- A git-shaped constellation, drawn entirely with native SVG. -->
