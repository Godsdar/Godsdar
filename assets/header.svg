 <text x="52" y="151" font-size="60" font-weight="650" letter-spacing="-2" fill="#e1def2">Hi, I'm Ildar<tspan fill="#e0af91">.</tspan></text>
 <text x="56" y="195" font-size="23" fill="#c4b6dc">Fullstack developer, frontend at heart.</text>
 <text x="56" y="235" font-size="17" fill="#aab2d1">TypeScript · Node.js / Express · React / Next.js</text>
 <text x="56" y="286" font-size="16" fill="#c7bdce">Word histories. Browser internals. A bit of 3D.</text>
